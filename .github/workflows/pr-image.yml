name: Build PR image

on:
  push:
    branches:
      - build/pr-971-image

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/hbjydev/pinepods
  TAG: pr-971

jobs:
  build:
    strategy:
      matrix:
        include:
          - architecture: amd64
            platform: linux/amd64
            dockerfile: dockerfile
            runner: ubuntu-latest
          - architecture: arm64
            platform: linux/arm64
            dockerfile: dockerfile-arm
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          build-args: PINEPODS_VERSION=${{ env.TAG }}
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}-${{ matrix.architecture }}

  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-architecture tag
        run: >-
          docker buildx imagetools create
          --tag ${{ env.IMAGE }}:${{ env.TAG }}
          ${{ env.IMAGE }}:${{ env.TAG }}-amd64
          ${{ env.IMAGE }}:${{ env.TAG }}-arm64
